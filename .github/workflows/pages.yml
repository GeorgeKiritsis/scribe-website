# Publishes the site to GitHub Pages on every push to main. Only the site itself goes up:
# recorder/ (the tooling that makes the demos) stays in the repository.
name: Publish the site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Gather the site
        run: |
          mkdir _site
          cp -R index.html manual.html changelog.html 404.html styles.css main.js motion.js interactive.js robots.txt sitemap.xml .nojekyll assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
